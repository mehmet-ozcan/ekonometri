:root{
  --bg:#f6f4ee; --panel:#ffffff; --panel2:#faf9f5; --ink:#16191f; --ink2:#454b56; --muted:#666c77; --line:#e2ded3;
  --accent:#2a45c4; --accent-ink:#ffffff; --accent-soft:#e8ecfb; --accent-line:#b9c4f1;
  --warm:#b05408; --warm-soft:#fbeadb; --good:#0f7a57; --good-soft:#dff3ea; --bad:#b3261e; --bad-soft:#fbe4e1;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 8px 28px rgba(20,24,40,.07);
  --font:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mat:"Cambria Math","STIX Two Math","Times New Roman",Times,serif;
  --ust-h:58px; --alt-h:62px;
}
:root[data-theme="dark"]{
  --bg:#0e1117; --panel:#171b24; --panel2:#1c212c; --ink:#eef0f4; --ink2:#bcc1cc; --muted:#98a0ad; --line:#2a303c;
  --accent:#92aaff; --accent-ink:#0b1230; --accent-soft:#1e2850; --accent-line:#34437c;
  --warm:#f2b560; --warm-soft:#3a2a14; --good:#55d3a4; --good-soft:#123a2d; --bad:#ff9288; --bad-soft:#40201d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:clamp(15px,.5vw + 11px,20px);-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
a{color:var(--accent);text-underline-offset:3px}
b,strong{font-weight:700}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.mat{font-family:var(--mat);font-style:italic}
.yun{font-family:var(--mat)}
.ust-cizgi{text-decoration:overline}
sub,sup{line-height:0}

/* ---------- Uygulama çatısı ---------- */
#app{position:fixed;inset:0;display:grid;grid-template-rows:var(--ust-h) 1fr auto;min-height:0}
.ust{display:flex;align-items:stretch;gap:14px;padding:0 clamp(10px,2vw,24px);background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.marka{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;letter-spacing:-.01em;white-space:nowrap;color:var(--ink)}
.marka svg{width:30px;height:30px;flex:none}
.sekmeler{display:flex;align-items:stretch;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding-left:6px}
.sekmeler::-webkit-scrollbar{display:none}
.sekme{position:relative;background:none;border:0;padding:0 clamp(10px,1.4vw,18px);color:var(--ink2);font-weight:600;font-size:.95rem;white-space:nowrap;border-radius:0}
.sekme:hover{color:var(--ink);background:var(--panel2)}
.sekme[aria-selected="true"]{color:var(--accent)}
.sekme[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.sekme .no{font-weight:500;color:var(--muted);margin-right:7px;font-variant-numeric:tabular-nums}
.araclar{display:flex;align-items:center;gap:4px}
.ikon{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink2)}
.ikon:hover{background:var(--panel2);border-color:var(--line);color:var(--ink)}
.ikon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme="dark"] .ikon .gunes{display:inline}
:root[data-theme="dark"] .ikon .ay{display:none}
:root:not([data-theme="dark"]) .ikon .gunes{display:none}

.govde{position:relative;min-height:0;display:flex}
#sahne{flex:1;min-width:0;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;outline:none;scroll-behavior:smooth}
.slayt{min-height:100%;max-width:1240px;margin:0 auto;padding:clamp(14px,2.2vw,34px) clamp(16px,3.6vw,56px) clamp(18px,2vw,30px);display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.5vw,20px);animation:gir .32s ease both}
.slayt.geri{animation-name:gir-geri}
@keyframes gir{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes gir-geri{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slayt,.slayt.geri{animation:none}*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

.alt{display:flex;align-items:center;gap:clamp(8px,1.6vw,18px);padding:8px clamp(10px,2vw,24px) calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);min-height:var(--alt-h)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:9px 16px;min-height:44px;font-weight:600;font-size:.95rem;color:var(--ink);line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.birincil{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.birincil:hover:not(:disabled){filter:brightness(1.1);color:var(--accent-ink)}
.btn.kucuk{min-height:36px;padding:5px 12px;font-size:.88rem;border-radius:9px}
.alt .btn{min-width:48px}
.alt .ileri-btn{max-width:min(46vw,320px)}
.alt .ileri-btn span,.alt .geri-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ilerleme{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.ilerleme .seritler{display:flex;gap:4px}
.ilerleme .seritler button{flex:1;height:22px;padding:8px 0;background:none;border:0;position:relative;min-width:6px}
.ilerleme .seritler button::before{content:"";position:absolute;left:0;right:0;top:8px;height:6px;border-radius:4px;background:var(--line);transition:background .2s}
.ilerleme .seritler button:hover::before{background:var(--accent-line)}
.ilerleme .seritler button.bitti::before{background:var(--accent-line)}
.ilerleme .seritler button.simdi::before{background:var(--accent)}
.ilerleme .bilgi{display:flex;justify-content:space-between;gap:12px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ilerleme .bilgi b{color:var(--ink2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ipucu{display:none}
@media (min-width:900px){.ipucu{display:inline}}

/* İçindekiler çekmecesi */
#perde{position:fixed;inset:0;background:rgba(8,10,16,.5);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#perde.acik{opacity:1;pointer-events:auto}
#cekmece{position:fixed;top:0;bottom:0;left:0;width:min(380px,90vw);z-index:31;background:var(--panel);border-right:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(-102%);transition:transform .25s ease;display:flex;flex-direction:column}
#cekmece.acik{transform:none}
#cekmece header{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#cekmece header h2{margin:0;font-size:1.05rem;flex:1}
#cekmece ol{list-style:none;margin:0;padding:8px 10px 24px;overflow:auto}
#cekmece .bolum{margin:14px 10px 4px;font-size:.76rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--warm)}
#cekmece li button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:baseline;width:100%;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:.95rem;line-height:1.3;color:var(--ink2)}
#cekmece li button:hover,#cekmece li button:focus-visible{background:var(--accent-soft);color:var(--ink)}
#cekmece li button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
#cekmece li .n{flex:0 0 1.7em;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}

/* Görsel büyütme */
#buyut{position:fixed;inset:0;z-index:40;background:rgba(8,10,16,.82);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#buyut img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#fff}

/* ---------- Slayt bileşenleri ---------- */
.etiket{font-size:.8rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--warm);margin:0}
h1.buyuk{font-size:clamp(2.2rem,6.4vw,4.8rem);line-height:1.02;letter-spacing:-.03em;margin:.1em 0 .15em;font-weight:800}
h2.bas{font-size:clamp(1.5rem,2.8vw,2.3rem);line-height:1.12;letter-spacing:-.02em;margin:0;font-weight:800}
.altbas{font-size:clamp(1rem,1.5vw,1.2rem);color:var(--ink2);margin:0;max-width:62ch}
.metin{font-size:clamp(1rem,1.3vw,1.2rem);line-height:1.6;max-width:68ch;margin:0}
.metin + .metin{margin-top:.8em}
.vurgu{background:linear-gradient(transparent 58%,var(--accent-soft) 58%);font-weight:600;padding:0 .12em}
.vurgu.sicak{background:linear-gradient(transparent 58%,var(--warm-soft) 58%)}
.kart{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(12px,1.5vw,20px);box-shadow:var(--shadow);min-width:0}
.kart h3{margin:0 0 .4em;font-size:1.12rem;line-height:1.25;letter-spacing:-.01em}
.kart p{margin:0 0 .6em}
.kart p:last-child{margin-bottom:0}
.kartlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:clamp(12px,1.6vw,20px)}
.iki{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(14px,2.2vw,32px);align-items:center}
.iki.dar-sol{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start}
.iki.dar-sag{grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:start}
@media (max-width:860px){.iki,.iki.dar-sol,.iki.dar-sag{grid-template-columns:minmax(0,1fr)}}
.slayt > *{min-width:0}
.kartlar.kol2{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.not{border-left:4px solid var(--warm);background:var(--warm-soft);padding:12px 16px;border-radius:0 12px 12px 0;font-size:1rem;color:var(--ink);max-width:70ch}
.not.mavi{border-left-color:var(--accent);background:var(--accent-soft)}
.not b:first-child{color:var(--warm)}
.not.mavi b:first-child{color:var(--accent)}
.alinti{border-left:4px solid var(--accent);padding:6px 0 6px 20px;font-style:italic;font-size:clamp(1.05rem,1.55vw,1.35rem);line-height:1.65;color:var(--ink);max-width:66ch}
.imza{display:block;font-style:normal;font-weight:700;color:var(--accent);margin-top:12px;font-size:1rem}
.rozet{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);vertical-align:2px;white-space:nowrap}
.rozet.sicak{background:var(--warm-soft);color:var(--warm)}
.rozet.yesil{background:var(--good-soft);color:var(--good)}
.anahtar{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2)}
.anahtar button{border:0;background:transparent;padding:9px 16px;min-height:42px;font-weight:600;font-size:.93rem;color:var(--ink2)}
.anahtar button:hover{background:var(--accent-soft)}
.anahtar button[aria-pressed="true"],.anahtar button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.arac-satir{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.kaydir{display:flex;align-items:center;gap:10px;font-size:.95rem;color:var(--ink2)}
.kaydir input[type=range]{width:clamp(120px,16vw,220px);accent-color:var(--accent);height:32px}
.kaydir b{color:var(--ink);min-width:2.4em;text-align:right;font-variant-numeric:tabular-nums}
.okuma{display:flex;flex-wrap:wrap;gap:8px 10px}
.okuma .kutu{display:flex;flex-direction:column;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 11px;min-width:88px}
.okuma .kutu i{font-style:normal;font-size:.78rem;color:var(--muted);letter-spacing:.02em}
.okuma .kutu b{font-size:1.2rem;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.okuma.iki-sutun{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.okuma.iki-sutun .kutu{flex-direction:row;justify-content:space-between;align-items:baseline;gap:8px;min-width:0;padding:5px 12px}
.okuma .kutu.vurgulu{border-color:var(--accent-line);background:var(--accent-soft)}
.okuma .kutu.vurgulu b{color:var(--accent)}
.okuma .kutu.sicak{border-color:var(--warm);background:var(--warm-soft)}
.okuma .kutu.sicak b{color:var(--warm)}
svg.sema{display:block;width:100%;height:auto}
svg.sema.graf-sinir{max-height:calc(100vh - 440px);min-height:190px}
svg.sema.graf-kucuk{max-height:230px;min-height:170px}
svg.sema.graf-genis{max-height:calc(100vh - 290px);min-height:240px}
svg text{font-family:var(--font)}
.sema .eks{stroke:var(--line);stroke-width:1}
.sema .izgara{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.sema .metin-svg{fill:var(--ink)}
.sema .sonuk{fill:var(--muted)}
.sema .mavi{fill:var(--accent)}
.sema .sicak{fill:var(--warm)}

/* Kapak slaytı */
.kapak{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(16px,3vw,48px);align-items:center}
@media (max-width:860px){.kapak{grid-template-columns:minmax(0,1fr)}.kapak .sanat{order:-1;max-width:420px}}
.kapak .kim{font-size:clamp(1.1rem,1.9vw,1.55rem);font-weight:700;margin:.3em 0 0}
.kapak .kurum{color:var(--ink2);margin:.15em 0 1.2em;font-size:clamp(.95rem,1.35vw,1.15rem)}
.kapak .sanat{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:clamp(10px,1.6vw,22px)}
.hero-sanat .nokta{fill:var(--accent);opacity:0;animation:belir .5s ease forwards}
.hero-sanat .dogru{stroke:var(--warm);stroke-width:3;stroke-linecap:round;fill:none;stroke-dasharray:520;stroke-dashoffset:520;animation:cizgi 1.1s .9s ease forwards}
.hero-sanat .artik{stroke:var(--accent);stroke-width:1.4;opacity:0;animation:belir .5s 1.6s ease forwards}
@keyframes belir{to{opacity:.85}}
@keyframes cizgi{to{stroke-dashoffset:0}}

/* Künye satırları */
.satirlar{display:flex;flex-direction:column}
.satir{display:flex;flex-wrap:wrap;gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.satir:last-child{border-bottom:0}
.satir dt,.satir > b{flex:0 0 150px;color:var(--muted);font-size:.85rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.satir dd,.satir > span{flex:1;min-width:180px;margin:0;font-size:1.08rem}
.kopya{margin-left:8px}

/* Kitap kapakları */
.kitaplar{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:clamp(14px,2vw,28px)}
.kitap{display:flex;gap:clamp(12px,1.6vw,22px);align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:clamp(12px,1.6vw,20px)}
.kitap button.kapak-img{all:unset;cursor:zoom-in;flex:0 0 clamp(110px,15vw,190px);border-radius:8px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .2s}
.kitap button.kapak-img:hover,.kitap button.kapak-img:focus-visible{transform:translateY(-3px) rotate(-1deg)}
.kitap img{display:block;width:100%;height:auto}
.kitap h3{margin:0 0 .15em;font-size:1.2rem;line-height:1.25}
.kitap .yazar{color:var(--accent);font-weight:700;margin:0 0 .5em}
.kitap ul{margin:.5em 0 0;padding-left:1.1em;color:var(--ink2);font-size:.95rem}

/* Değerlendirme */
.paylar{display:flex;height:clamp(54px,8vw,84px);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.paylar > div{display:flex;flex-direction:column;justify-content:center;padding:0 clamp(12px,2vw,26px);transition:flex-basis .4s ease}
.paylar .p1{background:var(--accent);color:var(--accent-ink)}
.paylar .p2{background:var(--warm);color:#fff}
:root[data-theme="dark"] .paylar .p2{color:#2a1a05}
.paylar b{font-size:clamp(1.3rem,3vw,2.3rem);line-height:1;letter-spacing:-.02em}
.paylar span{font-size:clamp(.78rem,1.2vw,1rem);opacity:.92;font-weight:600}
.hesap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;align-items:end}
.hesap label{display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--ink2);font-size:.95rem}
.hesap input[type=number]{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:10px 14px;font-size:1.35rem;font-weight:700;min-height:52px;width:100%;color:var(--ink);font-variant-numeric:tabular-nums}
.hesap input[type=number]:focus{outline:3px solid var(--accent-line);border-color:var(--accent)}
.sonuc{display:flex;flex-direction:column;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:14px;padding:10px 16px}
.sonuc i{font-style:normal;font-size:.8rem;color:var(--ink2);font-weight:600}
.sonuc b{font-size:2rem;letter-spacing:-.02em;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.15}

/* Tanımlar */
.def-kart{position:relative;overflow:hidden}
.def-kart .sembol{font-family:var(--mat);font-size:3rem;line-height:1;color:var(--accent);opacity:.2;position:absolute;right:14px;top:6px;font-style:italic}
.def-kart .tip{display:inline-block;margin-bottom:8px}
.etiket-satir{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cip{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;font-weight:600;padding:5px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2)}

/* Sınıflama oyunu */
.oyun-kart{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.oyun-ifade{font-size:clamp(1.3rem,2.6vw,2rem);font-weight:800;min-height:2.6em;display:flex;align-items:center;justify-content:center}
.oyun-secim{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.oyun-geri{min-height:3.2em;font-size:1rem;max-width:46ch}
.oyun-geri.dogru{color:var(--good)}
.oyun-geri.yanlis{color:var(--bad)}

/* Yunan alfabesi */
.yunan{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:900px){.yunan{grid-template-columns:repeat(4,1fr)}}
@media (max-width:520px){.yunan{grid-template-columns:repeat(3,1fr)}}
.harf{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;transition:transform .12s,border-color .12s}
.harf:hover{border-color:var(--accent);transform:translateY(-2px)}
.harf:focus-visible{outline:3px solid var(--accent)}
.harf .g{font-family:var(--mat);font-size:clamp(1.3rem,2.3vw,1.9rem);line-height:1.1;color:var(--ink)}
.harf .a{font-size:.78rem;color:var(--muted);min-height:1.2em}
.harf.secili{background:var(--accent-soft);border-color:var(--accent)}
.harf.gizli .a{visibility:hidden}
.harf-detay{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.harf-detay .dev{font-family:var(--mat);font-size:clamp(3rem,6vw,4.6rem);line-height:1;color:var(--accent);letter-spacing:.04em}
.harf-detay .ad{font-size:1.5rem;font-weight:800}
.rakam-seridi{display:flex;flex-wrap:wrap;gap:6px}
.rakam-seridi span{width:1.9em;height:1.9em;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-weight:700;font-variant-numeric:tabular-nums}
.sinav-sik{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.sik{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px 12px;font-weight:600;min-height:46px;text-align:left}
.sik:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.sik.dogru{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.sik.yanlis{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

/* Mini sınav */
.test{max-width:760px;width:100%}
.test .soru{font-size:clamp(1.15rem,2vw,1.6rem);font-weight:800;line-height:1.3;margin:0 0 14px}
.test .siklar{display:flex;flex-direction:column;gap:9px}
.test .sik{font-size:1.02rem;padding:13px 16px}
.test .geribildirim{margin-top:14px;padding:12px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:1rem}
.test .ust-satir{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.9rem;margin-bottom:10px;font-variant-numeric:tabular-nums}
.test .puan{font-size:3.4rem;font-weight:800;color:var(--accent);letter-spacing:-.03em;line-height:1}

/* Ekonometrinin amacı */
.amac-sekme{display:flex;flex-wrap:wrap;gap:10px}
.amac-sekme button{flex:1 1 200px;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:2px}
.amac-sekme button .n{font-size:.78rem;font-weight:800;color:var(--warm);letter-spacing:.08em}
.amac-sekme button b{font-size:1.08rem}
.amac-sekme button:hover{border-color:var(--accent)}
.amac-sekme button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.amac-sekme button[aria-selected="true"] .n{color:var(--accent-ink);opacity:.8}
.amac-govde p{font-size:clamp(.98rem,1.2vw,1.1rem);line-height:1.58;margin:0 0 .7em;max-width:78ch}
.amac-govde .ornek-kutu{background:var(--panel2);border:1px dashed var(--accent-line);border-radius:12px;padding:12px 16px;margin-top:6px}
.zincir{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 14px}
.zincir span.adim{background:var(--accent-soft);color:var(--accent);font-weight:700;padding:6px 14px;border-radius:99px;font-size:.95rem}
.zincir span.ok{color:var(--muted);font-weight:700}

/* Venn */
.venn-ic{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(12px,2vw,28px);align-items:center}
@media (max-width:860px){.venn-ic{grid-template-columns:minmax(0,1fr)}}
.venn svg{width:100%;height:auto;max-height:calc(100vh - 330px);min-height:300px;display:block}
.venn .daire{fill:none;stroke:var(--ink2);stroke-width:1.6}
.venn .cerceve{fill:var(--panel);stroke:var(--ink2);stroke-width:1.6}
.venn .vurgu-bolge{fill:var(--accent);opacity:0;transition:opacity .2s}
.venn .vurgu-bolge.acik{opacity:.28}
.venn .et{font-weight:700;font-size:17px;text-anchor:middle;cursor:pointer;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.venn .et.ana{fill:var(--bad)}
.venn .et.ara{fill:var(--accent)}
.venn .et.cekirdek{fill:var(--ink);font-size:19px}
.venn .et.cat{fill:var(--good);font-size:19px}
.venn .et:hover,.venn .et.secili{text-decoration:underline}
.venn .hit{fill:transparent;cursor:pointer}

/* Akış şeması */
.akis svg{width:100%;height:auto;max-height:calc(100vh - 215px);min-height:360px;display:block}
.akis .dugum rect{fill:var(--panel);stroke:var(--ink2);stroke-width:1.5;transition:fill .25s,stroke .25s,opacity .25s}
.akis .dugum text{fill:var(--ink);font-weight:700;font-size:15px;text-anchor:middle}
.akis .dugum{cursor:pointer;opacity:.38;transition:opacity .25s}
.akis .dugum.gorundu{opacity:1}
.akis .dugum.simdi rect{fill:var(--accent);stroke:var(--accent)}
.akis .dugum.simdi text{fill:var(--accent-ink)}
.akis .dugum.sicak.gorundu rect{stroke:var(--warm);stroke-width:2}
.akis .dugum.kabul.gorundu rect{stroke:var(--good);stroke-width:2}
.akis .dugum.red.gorundu rect{stroke:var(--bad);stroke-width:2}
.akis .dugum:focus-visible rect{stroke:var(--accent);stroke-width:3}
.akis .bag{fill:none;stroke:var(--ink2);stroke-width:2;opacity:.25;transition:opacity .25s}
.akis .bag.gorundu{opacity:1}
.akis .bag.kesik{stroke-dasharray:6 5;stroke:var(--warm)}
.akis .uc{fill:var(--ink2);opacity:.25;transition:opacity .25s}
.akis .uc.gorundu{opacity:1}
.akis .uc.kesik{fill:var(--warm)}
.akis .bag-yazi{font-size:13px;fill:var(--warm);font-weight:700}
.akis-yan{display:flex;flex-direction:column;gap:12px}
.akis-yan .aciklama{min-height:7.5em}
.akis-yan .aciklama h3{margin:0 0 6px}

/* Simülatör & grafikler */
.sim-bulut{background:var(--panel2);border:1px solid var(--line);border-radius:14px}
.sim-bulut circle{fill:var(--muted);opacity:.33;transition:opacity .2s,fill .2s,r .2s}
.sim-bulut circle.sec{fill:var(--accent);opacity:1}
.sim-bulut line.mu{stroke:var(--warm);stroke-width:2.5}
.tarih circle{fill:var(--accent);opacity:.75}
.tarih circle.son{fill:var(--warm);opacity:1}
.tarih line.mu{stroke:var(--warm);stroke-width:2.5}
.tarih text{fill:var(--ink2);font-size:12px}
.seri-cizgi{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
.seri-gel{fill:none;stroke:var(--warm);stroke-width:3;stroke-dasharray:7 6}
.seri-bant{fill:var(--warm);opacity:.16}
.seri-nokta{fill:var(--ink)}
.dag-nokta{fill:var(--accent);opacity:.8}
.dog-cizgi{stroke:var(--warm);stroke-width:3;fill:none}
.tablo{border-collapse:collapse;width:100%;font-size:1.02rem}
.tablo th,.tablo td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tablo th{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tablo td.sem{font-family:var(--mat);font-size:1.35rem;font-style:italic;color:var(--accent);white-space:nowrap}
.formul{font-family:var(--mat);font-size:clamp(1.3rem,2.4vw,1.9rem);font-style:italic;letter-spacing:.01em}
.formul i{font-style:italic}
.formul.kutu{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 18px}
.okul-secim{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.okul-secim{grid-template-columns:1fr}}
.okul{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:44px}
.okul:hover{border-color:var(--accent)}
.okul[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.okul .kim{font-weight:800;font-size:1.1rem}
.okul p{margin:0;font-size:.98rem;color:var(--ink2)}
.sunum-ipucu{font-size:.88rem;color:var(--muted)}
kbd{display:inline-block;min-width:1.6em;text-align:center;padding:0 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--panel);font-family:inherit;font-size:.85em;color:var(--ink)}
.tikla-ipucu{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.tikla-ipucu::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warm)}
@media print{#app{position:static}body{overflow:visible}.ust,.alt{display:none}}

/* ---------- Korelasyon sekmesi: formüller, tablolar ---------- */
.fm{font-size:clamp(1.1rem,1.9vw,1.55rem);line-height:1.5}
.fm .katex,.veri-tablo th .katex,.olcu-kart .ad .katex{font-size:1.1em}
.katex-display{margin:.3em 0}
.fm i{font-style:italic}
.fm .bar,.bar{text-decoration:overline;font-style:italic}
.fm .sol{color:var(--muted);font-size:.8em}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .22em;text-align:center}
.fr > .nu{padding:0 .3em .1em;border-bottom:1.5px solid currentColor}
.fr > .de{padding:.1em .3em 0}
.kk{display:inline-flex;align-items:stretch;vertical-align:middle}
.kk .kok{font-size:1.3em;line-height:1;margin-right:1px}
.kk .ic{border-top:1.5px solid currentColor;padding:0 .2em;margin-top:.12em}
.veri-tablo{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem;width:100%}
.veri-tablo th,.veri-tablo td{padding:4px 8px;text-align:center;border:1px solid var(--line);transition:opacity .35s,background .25s}
.veri-tablo thead th{background:var(--accent-soft);color:var(--accent);font-family:var(--mat);font-style:italic;font-weight:700;font-size:1.02em}
.veri-tablo tr.sf td{font-weight:700;background:var(--panel2)}
.veri-tablo.kompakt{font-size:.84rem}
.veri-tablo.kompakt th,.veri-tablo.kompakt td{padding:2px 8px}
.veri-tablo td.gizli{color:transparent!important}
.veri-tablo th.gizli{opacity:.3}
.fm sub,.veri-tablo sub{margin:0 .1em 0 .02em}
.veri-tablo td.yeni,.veri-tablo th.yeni{background:var(--warm-soft)}
.veri-tablo tbody tr:hover td,.veri-tablo tr.vurgulu td{background:var(--accent-soft)}
.veri-tablo td.eksi{color:var(--warm)}
.adim-blok{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:center;padding:8px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);animation:gir .3s ease both}
.adim-blok.son{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.adim-blok .cap{grid-column:1/-1;font-size:.9rem;font-weight:700;color:var(--warm)}
.fs{padding:.18em 0}
.fs + .fs{margin-top:.25em}
.adim-blok .deg{font-size:.98rem;color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right}
.adim-blok .deg b{color:var(--accent)}
@media (max-width:700px){.adim-blok{grid-template-columns:minmax(0,1fr)}.adim-blok .deg{text-align:left}}
.olcu-kart{flex:1 1 200px;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:6px;transition:background .25s,border-color .25s}
.olcu-kart .ad{font-size:1.2rem;font-family:var(--mat)}
.olcu-kart .deger{font-size:clamp(1.3rem,2.8vw,2.1rem);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.olcu-kart .et{font-size:.86rem;color:var(--ink2)}
.olcu-kart.degisti{background:var(--warm-soft);border-color:var(--warm)}
.olcu-kart.degisti .deger{color:var(--warm)}
.olcu-kart.sabit{background:var(--good-soft);border-color:var(--good)}
.olcu-kart.sabit .deger{color:var(--good)}
.olcu-kart.ilk .deger{color:var(--ink)}
.olcek{position:relative;height:16px;border-radius:99px;background:linear-gradient(90deg,var(--warm),var(--line) 50%,var(--accent));margin:30px 6px 8px}
.olcek .ibre{position:absolute;top:-9px;width:6px;height:34px;margin-left:-3px;border-radius:3px;background:var(--ink);transition:left .1s}
.olcek-et{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin:0 0 4px;gap:4px}
.olcek-et span{flex:1;text-align:center}
.olcek-et span:first-child{text-align:left}.olcek-et span:last-child{text-align:right}
.soru-giris{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:6px 0}
.soru-giris label{display:flex;align-items:center;gap:8px;font-family:var(--mat);font-style:italic;font-size:1.15rem}
.soru-giris input{width:7.5em;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:1.05rem;font-weight:700;min-height:42px;color:var(--ink);font-variant-numeric:tabular-nums}
.soru-giris input:focus{outline:3px solid var(--accent-line);border-color:var(--accent)}
.soru-giris input.dogru{border-color:var(--good);background:var(--good-soft)}
.soru-giris input.yanlis{border-color:var(--bad);background:var(--bad-soft)}

</style>
</head>
<body>
<div id="app">
  <header class="ust">
    <div class="marka" aria-label="Ekonometri">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--accent)"/><path d="M12 50L52 16" stroke="#f2b560" stroke-width="5" stroke-linecap="round"/><circle cx="18" cy="38" r="4.5" fill="#fff"/><circle cx="30" cy="42" r="4.5" fill="#fff"/><circle cx="36" cy="26" r="4.5" fill="#fff"/><circle cx="48" cy="24" r="4.5" fill="#fff"/></svg>
      <span>Ekonometri</span>
    </div>
    <nav class="sekmeler" id="sekmeler" role="tablist" aria-label="Bölümler"></nav>
    <div class="araclar">
      <button class="ikon" id="icBtn" type="button" title="İçindekiler (G)" aria-label="İçindekiler"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <button class="ikon" id="temaBtn" type="button" title="Koyu / açık tema (T)" aria-label="Koyu veya açık tema">
        <svg class="ay" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="gunes" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="ikon" id="tamBtn" type="button" title="Tam ekran (F)" aria-label="Tam ekran"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </header>

  <main id="sahne" tabindex="-1" aria-live="polite"></main>

  <footer class="alt">
    <button class="btn geri-btn" id="geriBtn" type="button" aria-label="Önceki slayt">← <span>Geri</span></button>
    <div class="ilerleme">
      <div class="seritler" id="seritler"></div>
      <div class="bilgi"><b id="slaytAd"></b><span id="sayac"></span></div>
    </div>
    <button class="btn birincil ileri-btn" id="ileriBtn" type="button" aria-label="Sonraki slayt"><span>İleri</span> →</button>
  </footer>
</div>

<div id="perde"></div>
<aside id="cekmece" aria-label="İçindekiler">
  <header><h2 id="cekmeceBaslik">İçindekiler</h2><button class="ikon" id="cekmeceKapat" type="button" aria-label="Kapat"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <ol id="cekmeceListe"></ol>
</aside>

      function bitir(ok) { ac = Math.max(ac, s0.ac); tabloCiz(); sonraki.hidden = false; sonraki.focus(); gerib.className = 'oyun-geri dogru'; gerib.textContent = (ok ? 'Doğru. ' : '') + s0.c; }

      } else {

        var kontrol = function () {
          var hepsi = true;

          if (hepsi) bitir(true); else { gerib.className = 'oyun-geri yanlis'; gerib.textContent = 'Henüz değil, tekrar deneyin.'; }
        };
        girisler.forEach(function (o) { o.i.addEventListener('keydown', function (e) { if (e.key === 'Enter') kontrol(); }); });
        kutu.appendChild(h('div', { class: 'soru-giris' }, girisler.map(function (o) { return h('label', {}, o.g.l, o.i); })));
        kutu.appendChild(h('div', { class: 'arac-satir' },
          h('button', { class: 'btn birincil kucuk', type: 'button', onclick: kontrol }, 'Kontrol et'),
          h('button', { class: 'btn kucuk', type: 'button', onclick: function () { girisler.forEach(function (o) { o.i.value = tr(o.g.v, o.g.tol ? 2 : 0).replace(/\./g, ''); o.i.className = 'dogru'; }); bitir(false); } }, 'Cevabı göster')));
        setTimeout(function () { if (girisler[0]) girisler[0].i.focus(); }, 30);
      }
      kutu.appendChild(gerib); kutu.appendChild(sonraki);
    }
    el.appendChild(h('div', { class: 'iki dar-sol', 'data-kaydirma-yok': '' },

      h('div', { style: 'display:flex;flex-direction:column;gap:12px' }, kutu, h('div', { class: 'kart', style: 'padding:6px' }, G.svg))));
    tabloCiz(); soruCiz();
  }
